<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base_story.css">
<style>
  body { background: var(--forest); }
  .story { background: var(--forest); color: var(--paper); justify-content: flex-start; }
  .eyebrow { color: var(--mustard); margin-bottom: 28px; }
  h1 { font-size: 84px; line-height: 1.05; color: var(--paper); margin: 0 0 24px; max-width: 13ch; }
  .lede { font-size: 30px; color: var(--paper-2); max-width: 22ch; margin: 0 0 80px; line-height: 1.4; }
  .sticker-zone { height: 220px; margin-top: auto; background: var(--forest-2); border-color: var(--mustard); color: var(--paper-2); }
</style></head>
<body>
  <div class="story">
    <span class="eyebrow display">CAIXA DE PERGUNTAS</span>
    <h1 class="display">Qual sua maior dúvida sobre <span style="color:var(--mustard)">revender produtos?</span></h1>
    <p class="lede">Manda aqui embaixo que eu respondo nos próximos stories.</p>
    <div class="sticker-zone">Coloque aqui o sticker de PERGUNTA</div>
    <span class="brandmark" style="color:var(--paper-2)">LUCRO RÁPIDO</span>
    <span class="pageno" style="color:var(--paper-2)">STORY 02</span>
  </div>
</body></html>

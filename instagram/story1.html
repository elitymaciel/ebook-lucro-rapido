<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base_story.css">
<style>
  .story { justify-content: flex-start; }
  .eyebrow { color: var(--forest-2); margin-bottom: 28px; }
  h1 { font-size: 92px; line-height: 1.02; color: var(--forest); margin: 0 0 24px; max-width: 12ch; }
  .lede { font-size: 30px; color: var(--ink-soft); max-width: 22ch; margin: 0 0 80px; line-height: 1.4; }
  .sticker-zone { height: 220px; margin-top: auto; }
</style></head>
<body>
  <div class="story">
    <span class="eyebrow display">ENQUETE</span>
    <h1 class="display">Você já tentou ganhar dinheiro extra <span style="color:var(--mustard)">online?</span></h1>
    <p class="lede">Responde aí embaixo — quero saber em que ponto a galera trava mais.</p>
    <div class="sticker-zone">Coloque aqui o sticker de ENQUETE<br>"Sim" / "Já desisti"</div>
    <span class="brandmark">LUCRO RÁPIDO</span>
    <span class="pageno">STORY 01</span>
  </div>
</body></html>

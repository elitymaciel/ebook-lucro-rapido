<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .slide { justify-content: flex-start; }
  .eyebrow { color: var(--forest-2); margin-bottom: 24px; }
  h2 { font-size: 62px; line-height: 1.05; color: var(--forest); margin: 0 0 56px; max-width: 15ch; }
  .receipt { background: var(--paper-2); border: 3px solid var(--line-strong); border-radius: 10px; padding: 44px 44px 36px; font-family: 'Roboto Mono', monospace; font-size: 28px; transform: rotate(-1deg); }
  .rhead { text-transform: uppercase; letter-spacing: 0.12em; font-size: 20px; color: var(--ink-soft); border-bottom: 2px dashed var(--line-strong); padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; }
  .rline { display: flex; justify-content: space-between; padding: 12px 0; }
  .rline.total { border-top: 2px dashed var(--line-strong); margin-top: 16px; padding-top: 24px; font-weight: 700; color: var(--forest); font-size: 34px; }
  .rline .lucro { color: var(--stamp); font-weight: 700; }
  .note { margin-top: 40px; font-size: 26px; color: var(--ink-soft); max-width: 26ch; }
</style></head>
<body>
  <div class="slide">
    <span class="eyebrow">A MATEMÁTICA POR TRÁS</span>
    <h2 class="display">Um exemplo real de margem</h2>
    <div class="receipt">
      <div class="rhead"><span>Cupom de exemplo</span><span>#001</span></div>
      <div class="rline"><span>Compra</span><span>R$ 30,00</span></div>
      <div class="rline"><span>Embalagem + frete</span><span>R$ 8,00</span></div>
      <div class="rline"><span>Preço de revenda</span><span>R$ 95,00</span></div>
      <div class="rline total"><span>Lucro</span><span class="lucro">+ R$ 57,00</span></div>
    </div>
    <p class="note">O guia te ensina a fórmula pra calcular isso em qualquer produto, antes de comprar.</p>
    <span class="brandmark">LUCRO RÁPIDO</span>
    <span class="pageno">04 / 07</span>
  </div>
</body></html>

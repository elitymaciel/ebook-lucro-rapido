<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base_story.css">
<style>
  .story { justify-content: flex-start; padding-top: 240px; }
  .eyebrow { color: var(--forest-2); margin-bottom: 20px; }
  h2 { font-size: 58px; line-height: 1.08; color: var(--forest); margin: 0 0 48px; max-width: 15ch; }
  .receipt { background: var(--paper-2); border: 3px solid var(--line-strong); border-radius: 12px; padding: 44px 40px 36px; font-family: 'Roboto Mono', monospace; font-size: 27px; transform: rotate(-1deg); }
  .rhead { text-transform: uppercase; letter-spacing: 0.12em; font-size: 19px; color: var(--ink-soft); border-bottom: 2px dashed var(--line-strong); padding-bottom: 18px; margin-bottom: 18px; display: flex; justify-content: space-between; }
  .rline { display: flex; justify-content: space-between; padding: 11px 0; }
  .rline.total { border-top: 2px dashed var(--line-strong); margin-top: 14px; padding-top: 22px; font-weight: 700; color: var(--forest); font-size: 32px; }
  .rline .lucro { color: var(--stamp); font-weight: 700; }
  .sticker-zone { height: 200px; margin-top: 56px; }
</style></head>
<body>
  <div class="story">
    <span class="eyebrow display">A MATEMÁTICA POR TRÁS</span>
    <h2 class="display">Um exemplo real de margem</h2>
    <div class="receipt">
      <div class="rhead"><span>Cupom de exemplo</span><span>#001</span></div>
      <div class="rline"><span>Compra</span><span>R$ 30,00</span></div>
      <div class="rline"><span>Embalagem + frete</span><span>R$ 8,00</span></div>
      <div class="rline"><span>Preço de revenda</span><span>R$ 95,00</span></div>
      <div class="rline total"><span>Lucro</span><span class="lucro">+ R$ 57,00</span></div>
    </div>
    <div class="sticker-zone">Coloque aqui o sticker "Isso funciona de verdade?"<br>(enquete Sim/Não ou slider de emoji)</div>
    <span class="brandmark">LUCRO RÁPIDO</span>
    <span class="pageno">STORY 03</span>
  </div>
</body></html>

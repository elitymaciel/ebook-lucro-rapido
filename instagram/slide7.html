<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--forest); }
  .slide { background: var(--forest); color: var(--paper); justify-content: center; align-items: center; text-align: center; }
  .eyebrow { color: var(--mustard); margin-bottom: 32px; }
  h2 { font-size: 56px; line-height: 1.1; color: var(--paper); margin: 0 0 44px; max-width: 16ch; }
  .tag { background: var(--paper); color: var(--forest); border-radius: 16px; padding: 56px 60px 48px; width: 640px; }
  .strike { font-family: 'Roboto Mono', monospace; color: var(--stamp); text-decoration: line-through; font-size: 26px; }
  .big { font-size: 108px; line-height: 1; margin: 12px 0 8px; }
  .big .cents { font-size: 54px; }
  .desc { font-family: 'Roboto Mono', monospace; font-size: 22px; color: var(--ink-soft); margin-bottom: 8px; }
  .cta { margin-top: 48px; font-family: 'Roboto Mono', monospace; font-size: 30px; letter-spacing: 0.06em; background: var(--mustard); color: var(--mustard-ink); padding: 22px 40px; border-radius: 6px; display: inline-block; }
  .guarantee { margin-top: 44px; font-size: 24px; color: var(--paper-2); }
</style></head>
<body>
  <div class="slide">
    <span class="eyebrow">PRONTO PRA COMEÇAR?</span>
    <h2 class="display">Sua 1ª venda pode sair ainda essa semana</h2>
    <div class="tag">
      <div class="strike mono">de R$ 67,00</div>
      <div class="big display">R$29<span class="cents">,90</span></div>
      <div class="desc">PDF · acesso imediato</div>
    </div>
    <div class="cta mono">LINK NA BIO →</div>
    <div class="guarantee">Garantia incondicional de 7 dias</div>
  </div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base_story.css">
<style>
  body { background: var(--forest); }
  .story { background: var(--forest); color: var(--paper); justify-content: flex-start; align-items: center; text-align: center; }
  .eyebrow { color: var(--mustard); margin-bottom: 28px; }
  h2 { font-size: 60px; line-height: 1.1; color: var(--paper); margin: 0 0 44px; max-width: 14ch; }
  .coupon { display: inline-block; border: 3px dashed var(--mustard); border-radius: 10px; padding: 14px 30px; font-family: 'Roboto Mono', monospace; font-size: 32px; font-weight: 700; letter-spacing: 0.08em; color: var(--mustard); margin-bottom: 36px; }
  .tag { background: var(--paper); color: var(--forest); border-radius: 16px; padding: 48px 52px 40px; width: 620px; }
  .strike { font-family: 'Roboto Mono', monospace; color: var(--stamp); text-decoration: line-through; font-size: 24px; }
  .big { font-size: 96px; line-height: 1; margin: 10px 0 8px; }
  .big .cents { font-size: 48px; }
  .desc { font-family: 'Roboto Mono', monospace; font-size: 20px; color: var(--ink-soft); margin-bottom: 4px; }
  .sticker-zone { height: 180px; margin-top: auto; width: 100%; background: var(--forest-2); border-color: var(--mustard); color: var(--paper-2); }
  .cta { margin-top: 44px; font-family: 'Roboto Mono', monospace; font-size: 28px; letter-spacing: 0.06em; color: var(--mustard); }
</style></head>
<body>
  <div class="story">
    <span class="eyebrow display">SÓ NA SEMANA DE LANÇAMENTO</span>
    <h2 class="display">Guia completo com desconto de lançamento</h2>
    <div class="coupon mono">LANCA7</div>
    <div class="tag">
      <div class="strike mono">de R$ 29,90</div>
      <div class="big display">R$19<span class="cents">,90</span></div>
      <div class="desc">PDF · acesso imediato · válido até 23/09</div>
    </div>
    <div class="cta">ARRASTE PRA CIMA →</div>
    <div class="sticker-zone">Coloque aqui o sticker de CONTAGEM REGRESSIVA<br>(até 23/09/2026)</div>
    <span class="brandmark" style="color:var(--paper-2)">LUCRO RÁPIDO</span>
    <span class="pageno" style="color:var(--paper-2)">STORY 04</span>
  </div>
</body></html>

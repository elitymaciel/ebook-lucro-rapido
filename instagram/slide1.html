<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--forest); }
  .slide { justify-content: center; align-items: flex-start; background: var(--forest); color: var(--paper); }
  .eyebrow { color: var(--mustard); margin-bottom: 28px; }
  h1 { font-size: 128px; line-height: 0.96; margin: 0; color: var(--paper); }
  h1 .accent { color: var(--mustard); }
  .lede { font-size: 34px; color: var(--paper-2); max-width: 16ch; margin-top: 32px; line-height: 1.3; }
  .swipe { position: absolute; bottom: 80px; right: 76px; font-family: 'Roboto Mono', monospace; font-size: 22px; color: var(--mustard); letter-spacing: 0.08em; }
</style></head>
<body>
  <div class="slide">
    <span class="eyebrow display" style="font-size:24px;">MÉTODO DE REVENDA ONLINE</span>
    <h1 class="display">COMPRE<br>BARATO.<br>REVENDA<br><span class="accent">RÁPIDO.</span></h1>
    <p class="lede">Como sair do zero até a sua primeira venda em até 7 dias</p>
    <span class="swipe">ARRASTE →</span>
  </div>
</body></html>

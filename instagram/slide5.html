<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--paper-2); }
  .slide { background: var(--paper-2); justify-content: flex-start; }
  .eyebrow { color: var(--forest-2); margin-bottom: 24px; }
  h2 { font-size: 64px; line-height: 1.05; color: var(--forest); margin: 0 0 48px; max-width: 15ch; }
  .ledger { border: 3px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .row { display: flex; align-items: baseline; gap: 24px; padding: 26px 32px; border-bottom: 2px dashed var(--line); }
  .row:last-child { border-bottom: none; }
  .row .idx { font-family: 'Roboto Mono', monospace; color: var(--ink-soft); font-size: 24px; width: 50px; flex: none; }
  .row .t { font-size: 30px; font-weight: 600; color: var(--ink); }
  span.tail { margin-top: 40px; font-size: 26px; color: var(--ink-soft); }
  span.tail strong { color: var(--forest); }
</style></head>
<body>
  <div class="slide">
    <span class="eyebrow">O QUE ESTÁ NO GUIA</span>
    <h2 class="display">5 dos 12 capítulos</h2>
    <div class="ledger">
      <div class="row"><span class="idx mono">03</span><span class="t">Onde encontrar produtos baratos</span></div>
      <div class="row"><span class="idx mono">05</span><span class="t">Onde revender cada tipo de item</span></div>
      <div class="row"><span class="idx mono">06</span><span class="t">A matemática do lucro</span></div>
      <div class="row"><span class="idx mono">07</span><span class="t">Fotos e anúncios que vendem</span></div>
      <div class="row"><span class="idx mono">11</span><span class="t">Plano de ação de 7 dias</span></div>
    </div>
    <span class="tail">+ 7 capítulos, incluindo <strong>logística</strong> e <strong>erros comuns</strong> de quem começa.</span>
    <span class="brandmark">LUCRO RÁPIDO</span>
    <span class="pageno">05 / 07</span>
  </div>
</body></html>
